name: CI - Testes Automatizados

# Desafio 3: a cada push/PR a pipeline roda a suíte, guarda relatório e
# evidência de falha, e publica um resumo com o status de cada módulo.
# A URL de cada ambiente vem daqui (ou do formulário do workflow_dispatch),
# não do código dos testes.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: URL base da API de consulta
        required: false
        default: https://brasilapi.com.br
      crud_api_base_url:
        description: URL base da API com criação, atualização e remoção
        required: false
        default: https://api.restful-api.dev
      e2e_base_url:
        description: URL base do site E2E
        required: false
        default: https://automationpratice.com.br

env:
  API_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.api_base_url || 'https://brasilapi.com.br' }}
  CRUD_API_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.crud_api_base_url || 'https://api.restful-api.dev' }}
  E2E_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.e2e_base_url || 'https://automationpratice.com.br' }}
  # Zero de propósito. Retry global mascarava instabilidade do E2E.
  E2E_RERUNS: "0"

jobs:
  qualidade-codigo:
    name: Qualidade do código (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-qualidade.txt

      - name: Instalar o ruff
        run: pip install -r requirements-qualidade.txt

      - name: Lint
        run: ruff check desafio-1-teste-api desafio-2-teste-e2e desafio-3-cicd

      - name: Formatação
        run: ruff format --check desafio-1-teste-api desafio-2-teste-e2e desafio-3-cicd

  testes-api:
    name: Testes de API (Desafio 1)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desafio-1-teste-api

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: desafio-1-teste-api/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar os testes e gerar o relatório
        run: |
          pytest -v \
            --html=relatorios/relatorio.html \
            --self-contained-html \
            --junitxml=relatorios/junit.xml

      - name: Guardar relatório e JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-api
          if-no-files-found: warn
          retention-days: 30
          path: |
            desafio-1-teste-api/relatorios/relatorio.html
            desafio-1-teste-api/relatorios/junit.xml

  testes-e2e:
    name: Testes E2E (Desafio 2)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desafio-2-teste-e2e

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: desafio-2-teste-e2e/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # o pytest.ini já usa --browser-channel chrome (o Chrome do sistema),
      # e os runners do GitHub Actions já vêm com o Google Chrome instalado.
      - name: Rodar os testes funcionais
        run: |
          pytest -v -m "not acessibilidade" \
            --html=relatorios/relatorio.html \
            --self-contained-html \
            --junitxml=relatorios/junit.xml

      - name: Guardar relatório, JUnit e evidências de falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-e2e
          if-no-files-found: warn
          retention-days: 30
          path: |
            desafio-2-teste-e2e/relatorios/relatorio.html
            desafio-2-teste-e2e/relatorios/junit.xml
            desafio-2-teste-e2e/relatorios/reexecucoes.json
            desafio-2-teste-e2e/relatorios/evidencias/

  testes-acessibilidade:
    name: Acessibilidade (Axe)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desafio-2-teste-e2e

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: desafio-2-teste-e2e/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Auditar home, login e checkout
        run: |
          pytest -v -m acessibilidade \
            --html=relatorios/relatorio.html \
            --self-contained-html \
            --junitxml=relatorios/junit.xml

      - name: Guardar relatório, JUnit e evidências de falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-acessibilidade
          if-no-files-found: warn
          retention-days: 30
          path: |
            desafio-2-teste-e2e/relatorios/relatorio.html
            desafio-2-teste-e2e/relatorios/junit.xml
            desafio-2-teste-e2e/relatorios/reexecucoes.json
            desafio-2-teste-e2e/relatorios/evidencias/

  resumo:
    name: Resumo e quality gate
    runs-on: ubuntu-latest
    needs: [qualidade-codigo, testes-api, testes-e2e, testes-acessibilidade]
    if: always()
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Baixar os resultados
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: resultado-*
          path: resultados

      - name: Publicar o resumo e aplicar o quality gate
        if: always()
        run: |
          python desafio-3-cicd/resumo_execucao.py resultados \
            --saida resultados/resumo.md \
            --job "Lint e formatação=${{ needs.qualidade-codigo.result }}" \
            --job "Testes de API=${{ needs.testes-api.result }}" \
            --job "Testes E2E=${{ needs.testes-e2e.result }}" \
            --job "Acessibilidade=${{ needs.testes-acessibilidade.result }}"

      - name: Guardar o resumo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resumo-execucao
          if-no-files-found: warn
          retention-days: 30
          path: resultados/resumo.md

  # -------------------------------------------------------------------------
  # Testes mobile (Desafio 5) ainda não existem neste repositório. O job
  # abaixo fica desativado (por isso o "if: false") só para deixar
  # registrado onde ele vai entrar quando o desafio correspondente for
  # implementado.
  # -------------------------------------------------------------------------
  testes-mobile:
    name: Testes Mobile (Desafio 5 - ainda não implementado)
    runs-on: ubuntu-latest
    if: false
    steps:
      - run: echo "Job reservado para os testes mobile do Desafio 5."
