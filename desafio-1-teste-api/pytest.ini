[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    positivo: cenario de sucesso (entrada valida)
    negativo: cenario de erro (entrada invalida, dado ausente, metodo nao suportado etc.)
    contrato: validacao de schema alem de status, headers e conteudo
    crud: criacao, atualizacao e remocao real de um recurso
