[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# roda tudo sem interface gráfica por padrão (mais rápido e é o que roda no CI)
# uso o channel "chrome" (o Google Chrome do sistema) em vez do chromium
# embutido do Playwright, porque o download do binário do Playwright é
# bloqueado em alguns ambientes de CI/sandbox - assim evito depender disso
#
# A URL do site não fica aqui. Ela vem da variável E2E_BASE_URL.
#
# Screenshot e trace só são guardados quando o cenário falha. A pasta
# relatorios/evidencias é o que a pipeline publica como artefato.
#
# Não há --reruns global. Retry só com E2E_RERUNS>0 e, mesmo assim, teste
# que passa só na retentativa reprova a suíte (conftest.py).
addopts =
    --browser chromium
    --browser-channel chrome
    --screenshot=only-on-failure
    --tracing=retain-on-failure
    --output=relatorios/evidencias

markers =
    positivo: caminho feliz (navegação/ação que dá certo)
    negativo: cenário de erro (campo obrigatório vazio, dado inválido etc.)
    acessibilidade: auditoria com axe-core nas jornadas criticas
