[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# roda tudo sem interface gráfica por padrão (mais rápido e é o que roda no CI)
# uso o channel "chrome" (o Google Chrome do sistema) em vez do chromium
# embutido do Playwright, porque o download do binário do Playwright é
# bloqueado em alguns ambientes de CI/sandbox - assim evito depender disso
#
# --reruns: como estamos testando contra um site de terceiros de verdade
# (não um mock local), de vez em quando uma imagem demora pra carregar ou a
# rede engasga por um instante. Tentar de novo automaticamente 2x antes de
# marcar como falha de fato é uma prática comum em E2E contra ambientes que
# a gente não controla, e evita quebrar o pipeline por uma lentidão pontual
addopts = --browser chromium --browser-channel chrome --base-url https://automationpratice.com.br --reruns 2 --reruns-delay 2

markers =
    positivo: caminho feliz (navegação/ação que dá certo)
    negativo: cenário de erro (campo obrigatório vazio, dado inválido etc.)
